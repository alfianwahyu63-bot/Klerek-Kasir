/* Make every palette apply to complete app rather than changing accent only. */
html{background:var(--bg);color-scheme:dark}
:root[data-theme="modern-blue"],:root[data-theme="pos-orange"],:root[data-theme="minimal-light"]{color-scheme:light}
body{background:radial-gradient(ellipse 700px 360px at 50% -180px,var(--body-glow),transparent),var(--bg);color:var(--white)}
input{color:var(--white)}
.logo{background:linear-gradient(143deg,var(--accent-a),var(--accent-b));box-shadow:0 9px 20px color-mix(in srgb,var(--blue) 20%,transparent)}
.icon-button{color:var(--white)}.back{color:var(--white)}
.date-box{background:linear-gradient(110deg,var(--panel-c),var(--panel-b))}.date-control{color:var(--white);color-scheme:inherit}
.notice{background:var(--muted-bg);border-color:var(--muted-border);color:var(--muted)}
.card{background:linear-gradient(135deg,var(--panel-a),var(--panel-b))}
.hero{background:linear-gradient(124deg,var(--accent-a),var(--accent-b) 60%,var(--accent-c));border-color:var(--accent-border);color:#fff;box-shadow:0 12px 28px color-mix(in srgb,var(--blue) 22%,transparent)}
.hero .hero-label,.hero .hero-bottom,.hero .hero-bottom strong{color:#fff}
.kpi{background:linear-gradient(155deg,var(--kpi-a),var(--panel-b))}
.kpi-label,.cash-totals small{color:var(--text-sub)}
.cash-line:active,.menu-item:active{background:var(--hover)}
.btn{color:var(--white);background:var(--chip-bg);border-color:var(--chip-border)}
.btn.primary{background:linear-gradient(125deg,var(--accent-a),var(--accent-b));color:#fff;border-color:var(--accent-border);box-shadow:0 7px 15px color-mix(in srgb,var(--blue) 17%,transparent)}
.data-row{border-bottom-color:var(--line-deep)}.data-row span{color:var(--muted)}.line-divider{background:var(--line-deep)}
.bottom{background:var(--nav-surface);border-top-color:var(--border);box-shadow:0 -6px 25px #09132214}
.nav{color:var(--nav-ink)}.nav.active{color:var(--blue)}
.segment{border-color:var(--border);background:var(--pill-bg)}.segment button{color:var(--muted)}
.segment button.active{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff}
.name-field{color:var(--white)}.row-labels{color:var(--text-sub)}
.entry input{border-color:var(--input-stroke);background:var(--field-bg);color:var(--field-text)}
.entry input:focus{border-color:var(--blue);background:var(--input)}
.inline-add{border-color:var(--border);color:var(--blue);background:var(--panel-c)}
.cash-totals{border-top-color:var(--line-deep)}
.net-box{border-color:var(--soft-deep-border);background:var(--soft-deep)}.net-box .net-label{color:var(--white)}.net-box .net-hint{color:var(--muted)}
.calc-formula{color:var(--muted)}.field-label{color:var(--white)}
.input-wrap{border-color:var(--input-stroke);background:var(--field-bg)}.input-wrap:focus-within{border-color:var(--blue)}.input-wrap input{color:var(--field-text)}.prefix{color:var(--muted)}
.box-highlight{border-color:var(--soft-deep-border);background:var(--soft-deep)}.box-highlight .smallcap{color:var(--muted)}
.menu-item,.history-row{background:var(--card);border-color:var(--border);color:var(--white)}
.search-input{border-color:var(--input-stroke);background:var(--panel-a);color:var(--white)}.search-input::placeholder{color:var(--muted)}
.empty{color:var(--muted)}.empty strong,.date-large{color:var(--white)}
.footer-note{color:var(--muted)}.toast{background:var(--toast-bg);border-color:var(--toast-bg);color:#fff}
:root[data-theme="modern-blue"] .cash-line,:root[data-theme="pos-orange"] .cash-line,:root[data-theme="minimal-light"] .cash-line{box-shadow:0 3px 13px #00000006}
/* user-selectable layouts */
:root[data-layout="compact"] .app-head{padding-top:16px;padding-bottom:10px}
:root[data-layout="compact"] .content{padding-left:13px;padding-right:13px}
:root[data-layout="compact"] .card{padding:11px;border-radius:12px;margin-bottom:9px}
:root[data-layout="compact"] .hero{padding:15px}
:root[data-layout="compact"] .kpi-grid{gap:7px;margin-bottom:9px}
:root[data-layout="compact"] .kpi{padding:10px;border-radius:11px}
:root[data-layout="compact"] .kpi-value{margin-top:5px}
:root[data-layout="compact"] .section-title{margin-top:13px;margin-bottom:8px}
:root[data-layout="compact"] .cash-line{padding:9px 10px}
:root[data-layout="compact"] .menu-item{padding:9px 10px;margin-bottom:5px}
:root[data-layout="compact"] .entry input{padding:9px 5px}
:root[data-layout="compact"] .bottom{padding-top:5px}
:root[data-layout="compact"] .hero-bottom{margin-top:11px;padding-top:9px}
:root[data-layout="focus"] .content{padding-left:18px;padding-right:18px}
:root[data-layout="focus"] .card{border-radius:20px;padding:19px;margin-bottom:15px}
:root[data-layout="focus"] .hero{padding:21px}
:root[data-layout="focus"] .kpi-grid{grid-template-columns:1fr 1fr;gap:12px}
:root[data-layout="focus"] .kpi{padding:17px 13px}
:root[data-layout="focus"] .entry input{min-height:53px;font-size:clamp(12px,3.3vw,15px);padding:13px 5px}
:root[data-layout="focus"] .btn{min-height:51px;font-size:13px}
:root[data-layout="focus"] .nav{min-height:59px;font-size:11px}
:root[data-layout="focus"] .menu-item{padding:17px 14px}
:root[data-layout="focus"] .hero-value{font-size:clamp(28px,7.9vw,39px)}
/* theme & layout controls */
.appearance-intro{font-size:12px;color:var(--muted);margin:0 0 13px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 4px}
.theme-choice{min-width:0;border:2px solid var(--border);background:var(--panel-a);border-radius:15px;padding:12px 10px;text-align:left;color:var(--white);position:relative;transition:border-color .15s,transform .15s}
.theme-choice:active{transform:scale(.98)}.theme-choice.is-active{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 18%,transparent)}
.theme-choice .swatches{display:flex;align-items:center;gap:3px;margin-bottom:10px;height:24px}
.swatches i{display:block;width:24px;height:24px;border-radius:7px;border:1px solid #8c9bae35;box-shadow:0 2px 5px #00000012}
.swatches i:nth-child(2){transform:translateY(-2px)}
.theme-name{font-weight:800;font-size:12px;line-height:1.35}.theme-description{font-size:10px;color:var(--muted);margin-top:3px}
.selected-check{position:absolute;right:9px;top:7px;color:var(--blue);font-weight:900;font-size:15px}
.layout-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 4px}
.layout-choice{border:2px solid var(--border);background:var(--panel-a);border-radius:13px;padding:11px 7px;color:var(--white);text-align:center;min-width:0}
.layout-choice.is-active{border-color:var(--blue);background:var(--panel-c)}
.layout-pictogram{display:flex;flex-direction:column;gap:3px;height:26px;align-items:center;justify-content:center;margin-bottom:7px}
.layout-pictogram i{display:block;height:4px;width:65%;border-radius:3px;background:var(--blue)}
.layout-choice[data-layout="compact"] .layout-pictogram{gap:1px}
.layout-choice[data-layout="focus"] .layout-pictogram i{height:6px;width:83%}
.layout-name{font-size:11px;font-weight:780}.layout-help{font-size:10px;line-height:1.3;color:var(--muted);margin-top:3px}
.appearance-note{padding:10px 12px;border-radius:11px;background:var(--panel-c);color:var(--muted);font-size:11px;margin-top:14px}
@media(max-width:355px){.theme-grid{gap:7px}.theme-choice{padding:10px 8px}.layout-grid{gap:6px}.layout-choice{padding:9px 4px}}

</style>
</head>
<body>
<div class="app"><header class="app-head" id="header"></header><main class="content" id="screen"></main></div>
<nav class="bottom" aria-label="Navigasi utama"><div class="bottom-inner" id="nav"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input id="import-file" type="file" accept=".json,application/json" style="display:none">
<script>
(function(){'use strict';
const SVG={calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8v4H8zM8 14h1m3 0h1m3 0h1M8 18h1m3 0h1m3 0h1"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5a7 7 0 0 0 0-3l2-1-2-4-2 1a7 7 0 0 0-2.5-1.5L14 2h-4l-.5 3a7 7 0 0 0-2.5 1.5l-2-1-2 4 2 1a7 7 0 0 0 0 3l-2 1 2 4 2-1a7 7 0 0 0 2.5 1.5L10 22h4l.5-3a7 7 0 0 0 2.5-1.5l2 1 2-4z"/>',back:'<path d="m15 18-6-6 6-6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/>',save:'<path d="M4 3h14l3 3v15H3V3zM7 3v7h10V3M7 21v-8h10v8"/>',plus:'<path d="M12 4v16M4 12h16"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 9h18m-6 6h3"/>',file:'<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM13 2v7h7M8 14h8M8 18h8"/>',check:'<path d="m4 12 5 5L20 6"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v7m4-7v7"/>',reset:'<path d="M3 11a9 9 0 1 1 3 7m-3 1v-6h6"/>'};
const icon=(k,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[k]||SVG.calc}</svg>`;
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const money=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID');
const fmt=n=>Math.round(Number(n)||0).toLocaleString('id-ID');
const readN=s=>{let n=parseInt(String(s||'').replace(/[^0-9-]/g,''),10);return Number.isFinite(n)?n:0};
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const sum=xs=>xs.reduce((a,b)=>a+(Number(b)||0),0);
const niceDate=s=>{let d=new Date((s||today())+'T12:00:00');return Number.isNaN(d.getTime())?s:new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)};
const shortDate=s=>{let d=new Date((s||today())+'T12:00:00');return Number.isNaN(d.getTime())?s:new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric'}).format(d)};
const NEW={date:today(),shifts:[{cashiers:[{name:'Kasir 1',rows:[{pickup:0,etrans:0,pln:0}]},{name:'Kasir 2',rows:[{pickup:0,etrans:0,pln:0}]}]},{cashiers:[{name:'Kasir 1',rows:[{pickup:0,etrans:0,pln:0}]},{name:'Kasir 2',rows:[{pickup:0,etrans:0,pln:0}]}]}],store:{sales:0,settleEtrans:0,settlePln:0,etransShift1:0,plnShift1:0,deposits:[0]}};
// Menggunakan kunci penyimpanan versi lama agar data yang masih tersedia dapat dibaca.
const DATA_KEY='klerek_kasir_v1',HISTORY_KEY='klerek_kasir_history_v1';
let state=clone(NEW),history=[],page='dashboard',selectedShift=0,stored=false,query='';

const PREF_KEY='klerek_kasir_tampilan_v1';
const THEMES=[
{id:'premium-dark',name:'Premium Dark',desc:'Navy • biru elektrik',sw:['#071321','#13243a','#1178ff']},
{id:'modern-blue',name:'Modern Blue',desc:'Biru cerah profesional',sw:['#eef4ff','#ffffff','#236ff7']},
{id:'pos-orange',name:'Modern POS',desc:'Putih • oranye hangat',sw:['#fff8ef','#ffffff','#ea6623']},
{id:'smart-green',name:'Smart Cash',desc:'Hijau elegan',sw:['#061c1a','#102e29','#10b889']},
{id:'minimal-light',name:'Minimalist',desc:'Putih bersih',sw:['#f5f6f9','#ffffff','#4f6ab6']},
{id:'purple-night',name:'Purple Night',desc:'Ungu gelap premium',sw:['#120f23','#221b3b','#9d73f8']}
];
const LAYOUTS=[{id:'standard',name:'Standar',desc:'Seimbang'},{id:'compact',name:'Ringkas',desc:'Lebih padat'},{id:'focus',name:'Besar',desc:'Mudah dibaca'}];
let preferences={theme:'premium-dark',layout:'standard'};
try{let p=JSON.parse(localStorage.getItem(PREF_KEY)||'null');if(p&&typeof p==='object')preferences={...preferences,...p}}catch(e){}
function applyAppearance(){
 if(!THEMES.some(t=>t.id===preferences.theme))preferences.theme='premium-dark';
 if(!LAYOUTS.some(t=>t.id===preferences.layout))preferences.layout='standard';
 const root=document.documentElement;root.dataset.theme=preferences.theme;root.dataset.layout=preferences.layout;
 const light=['modern-blue','pos-orange','minimal-light'].includes(preferences.theme);
 document.querySelector('meta[name="color-scheme"]').setAttribute('content',light?'light':'dark');
 const bg=THEMES.find(t=>t.id===preferences.theme).sw[0];document.querySelector('meta[name="theme-color"]').setAttribute('content',bg);
 try{localStorage.setItem(PREF_KEY,JSON.stringify(preferences))}catch(e){}
}
function changeAppearance(k,v){
 if(k==='theme'&&THEMES.some(t=>t.id===v))preferences.theme=v;
 else if(k==='layout'&&LAYOUTS.some(t=>t.id===v))preferences.layout=v;
 else return;
 applyAppearance();render();notify('Tampilan berhasil diubah');
}
applyAppearance();

try{let existing=JSON.parse(localStorage.getItem(DATA_KEY)||'null'),h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(existing&&Array.isArray(existing.shifts)){state=existing;stored=true}if(Array.isArray(h))history=h}catch(e){}
function normalize(){if(!Array.isArray(state.shifts))state.shifts=clone(NEW.shifts);for(let i=0;i<2;i++){if(!state.shifts[i])state.shifts[i]=clone(NEW.shifts[i]);if(!Array.isArray(state.shifts[i].cashiers))state.shifts[i].cashiers=clone(NEW.shifts[i].cashiers);for(let j=0;j<2;j++){if(!state.shifts[i].cashiers[j])state.shifts[i].cashiers[j]=clone(NEW.shifts[i].cashiers[j]);let c=state.shifts[i].cashiers[j];if(!Array.isArray(c.rows)||!c.rows.length)c.rows=[{pickup:0,etrans:0,pln:0}];if(typeof c.name!=='string')c.name='Kasir '+(j+1)}}state.store={...NEW.store,...(state.store||{})};if(!Array.isArray(state.store.deposits)||!state.store.deposits.length)state.store.deposits=[0];if(!state.date)state.date=today()}
normalize();
function save(){try{localStorage.setItem(DATA_KEY,JSON.stringify(state));localStorage.setItem(HISTORY_KEY,JSON.stringify(history));return true}catch(e){return false}}
function totals(c){let p=sum(c.rows.map(r=>r.pickup)),e=sum(c.rows.map(r=>r.etrans)),l=sum(c.rows.map(r=>r.pln));return {pickup:p,etrans:e,pln:l,net:p-e-l}}
function rollup(k,si){return sum((si===undefined?state.shifts.flatMap(s=>s.cashiers):state.shifts[si].cashiers).map(c=>totals(c)[k]))}
function headTotals(){let s=state.store,deposit=sum(s.deposits),subtotal=(+s.sales||0)+(+s.settleEtrans||0)+(+s.settlePln||0),etrans2=(+s.settleEtrans||0)-(+s.etransShift1||0),pln2=(+s.settlePln||0)-(+s.plnShift1||0);return {deposit,subtotal,remainder:subtotal-deposit,etrans2,pln2,diffE:rollup('etrans',0)-etrans2,diffP:rollup('pln',0)-pln2,diffE1:rollup('etrans',0)-(+s.etransShift1||0),diffE2:rollup('etrans',1)-etrans2,diffP1:rollup('pln',0)-(+s.plnShift1||0),diffP2:rollup('pln',1)-pln2}}
function historyTotal(item){return sum((item.shifts||[]).flatMap(s=>(s.cashiers||[]).map(c=>totals(c).net)))}
function kpi(label,value,kind,mark){return `<div class="kpi"><div class="kpi-top"><span class="kpi-symbol ${kind}">${mark}</span><span class="kpi-label">${label}</span></div><div class="kpi-value" data-live="${label.replace(/[^a-z]/gi,'')}">${money(value)}</div></div>`}
function dateBox(){return `<div class="date-box"><span style="color:#a5caff">${icon('calendar',19)}</span><span class="date-name">${esc(niceDate(state.date))}</span><input class="date-control" aria-label="Pilih tanggal perhitungan" type="date" data-date value="${esc(state.date)}"></div>`}
function dashboard(){let h=headTotals(),v=rollup('net');return `${!stored?'<div class="notice"><strong>Siap digunakan.</strong> Isi data kasir melalui menu Perhitungan. Semua angka dimulai dari nol.</div>':''}${dateBox()}<section class="card hero"><div class="hero-row"><div class="hero-icon">${icon('wallet',27)}</div><div class="grow"><div class="hero-label">TOTAL KLEREK HARI INI</div><div class="hero-value">${money(v)}</div></div></div><div class="hero-bottom"><div>Shift 1<strong>${money(rollup('net',0))}</strong></div><div>Shift 2<strong>${money(rollup('net',1))}</strong></div></div></section><div class="kpi-grid">${kpi('Total Pickup',rollup('pickup'),'green','↗')}${kpi('Total eTrans',rollup('etrans'),'orange','▣')}${kpi('Total PLN',rollup('pln'),'purple','ϟ')}${kpi('Setoran Tunai',h.deposit,'blue','▤')}</div><div class="section-title">Rekap per Kasir <span class="aux">4 kasir · 2 shift</span></div><div class="cash-list">${state.shifts.map((s,i)=>s.cashiers.map((c,j)=>{let n=totals(c).net;return `<button class="cash-line" data-edit="${i},${j}"><span class="avatar ${i===0?(j?'alt1':''):(j?'alt3':'alt2')}">${j+1}</span><span class="grow"><span class="cash-name">${esc(c.name||'Kasir '+(j+1))}</span><span class="cash-shift" style="display:block">Shift ${i+1} · Kasir ${j+1}</span></span><span class="cash-amount ${n<0?'neg':''}">${money(n)}</span><span class="chevron">›</span></button>`}).join('')).join('')}</div><div class="section-title">Akses cepat</div><div class="row-actions"><button class="btn primary" data-go="calc">${icon('calc',17)} Perhitungan</button><button class="btn" data-go="recap">${icon('file',17)} Lihat rekap</button></div><div class="row-actions mt10"><button class="btn" data-action="archive">${icon('save',16)} Simpan riwayat</button><button class="btn" data-action="copy">${icon('copy',16)} Salin rekap</button></div><div class="footer-note">${icon('check',14)} Perubahan disimpan otomatis di browser perangkat ini.<br>Cadangkan data secara berkala dari menu Lainnya.</div>`}
function cashCard(si,ci){let c=state.shifts[si].cashiers[ci],t=totals(c),kl=`${si}_${ci}`;return `<section class="card cash-card"><div class="cash-top"><div class="avatar ${ci?'alt1':''}">${ci+1}</div><div class="grow"><label for="name-${kl}">Kasir ${ci+1} (Shift ${si+1}) · Nama dapat diubah</label><input id="name-${kl}" class="name-field" maxlength="55" aria-label="Nama kasir ${ci+1} shift ${si+1}" data-name="${si},${ci}" value="${esc(c.name)}" placeholder="Nama kasir"></div><span class="tiny-status" id="badge-${kl}">${t.net===0?'SEIMBANG':t.net>0?'LEBIH':'KURANG'}</span></div><div class="row-labels"><span>Pickup</span><span>eTrans</span><span>PLN</span><span></span></div>${c.rows.map((r,ri)=>`<div class="entry">${['pickup','etrans','pln'].map(k=>`<input type="text" inputmode="numeric" autocomplete="off" aria-label="${k} baris ${ri+1} kasir ${ci+1}" data-money="${si},${ci},${ri},${k}" value="${r[k]?fmt(r[k]):''}" placeholder="0">`).join('')}<button class="xrow" data-delete="${si},${ci},${ri}" title="Hapus baris" aria-label="Hapus baris ${ri+1}">×</button></div>`).join('')}<button class="inline-add" data-add="${si},${ci}">＋ Tambah baris</button><div class="cash-totals">${[['pickup','Pickup'],['etrans','eTrans'],['pln','PLN']].map(([k,label])=>`<div><small>Total ${label}</small><b data-live="s${si}c${ci}${k}">${money(t[k])}</b></div>`).join('')}</div><div class="net-box ${t.net<0?'negative':''}" id="netbox-${kl}"><div><div class="net-label">HASIL KLEREK</div><div class="net-hint">Pickup − eTrans − PLN</div></div><div class="net-value" data-live="s${si}c${ci}net">${money(t.net)}</div></div></section>`}
function calcScreen(){let i=selectedShift;return `<div class="segment" role="group" aria-label="Pilih shift"><button data-shift="0" class="${i===0?'active':''}">Shift 1</button><button data-shift="1" class="${i===1?'active':''}">Shift 2</button></div>${state.shifts[i].cashiers.map((_,j)=>cashCard(i,j)).join('')}<div class="card"><div class="section-title" style="margin:0 0 5px">Total Shift ${i+1}</div>${[['pickup','Pickup'],['etrans','eTrans'],['pln','PLN'],['net','Hasil Klerek']].map(([k,t])=>`<div class="data-row"><span>${t}</span><strong class="${k==='net'?'number':''}" data-live="shift${i+1}${k}">${money(rollup(k,i))}</strong></div>`).join('')}</div><div class="row-actions"><button class="btn" data-action="reset-shift">${icon('reset',17)} Reset Shift</button><button class="btn primary" data-action="archive">${icon('save',17)} Simpan</button></div><div class="notice mt14">Rumus sesuai file Excel: <strong>Klerek = Pickup − eTrans − PLN</strong>. Nilai negatif berarti hasil klerek minus.</div>`}
function cashierRecap(si,ci){let c=state.shifts[si].cashiers[ci],t=totals(c);return `<div class="card mini-section"><div class="cash-top" style="margin-bottom:5px"><span class="avatar ${ci?'alt1':''}">${ci+1}</span><div class="grow"><div style="font-weight:800;font-size:14px">${esc(c.name||'Kasir '+(ci+1))}</div><div class="hint">Shift ${si+1} · Kasir ${ci+1}</div></div><button class="icon-button" data-edit="${si},${ci}" aria-label="Edit ${esc(c.name)}">✎</button></div>${[['pickup','Pickup'],['etrans','eTrans'],['pln','PLN'],['net','Klerek']].map(([k,label])=>`<div class="data-row"><span>${label}</span><strong class="${k==='net'?(t.net<0?'negative':'number'):''}">${money(t[k])}</strong></div>`).join('')}</div>`}
function recapScreen(){return `${dateBox()}<div class="section-title">Rekap per Kasir</div>${state.shifts.map((s,i)=>`<div class="section-title" style="margin:14px 1px 9px;color:#a9c7f8">SHIFT ${i+1} <span class="aux">${money(rollup('net',i))}</span></div>${s.cashiers.map((_,j)=>cashierRecap(i,j)).join('')}`).join('')}<div class="section-title">Total Keseluruhan</div><div class="kpi-grid">${kpi('Total Pickup',rollup('pickup'),'green','↗')}${kpi('Total eTrans',rollup('etrans'),'orange','▣')}${kpi('Total PLN',rollup('pln'),'purple','ϟ')}${kpi('Total Klerek',rollup('net'),'blue','▤')}</div><div class="row-actions"><button class="btn primary" data-action="copy">${icon('copy',17)} Salin Rekap</button><button class="btn" data-action="csv-export">${icon('file',17)} Ekspor CSV</button></div><button class="btn full mt10" data-go="store">Rekap Kepala Toko →</button>`}
function field(label,key,info=''){return `<div class="field"><label class="field-label" for="st-${key}">${esc(label)} ${info?`<span class="hint">${esc(info)}</span>`:''}</label><div class="input-wrap"><span class="prefix">Rp</span><input id="st-${key}" data-store="${key}" type="text" inputmode="numeric" value="${state.store[key]?fmt(state.store[key]):''}" placeholder="0"></div></div>`}
function storeScreen(){let h=headTotals();return `${dateBox()}<div class="card"><div class="section-title" style="margin:0 0 8px">Sales & Settlement</div>${field('Sales (Report 23–24)','sales')}${field('Settle eTrans','settleEtrans')}${field('Settle PLN','settlePln')}<div class="data-row"><span>Subtotal penjualan</span><strong data-live="subtotal">${money(h.subtotal)}</strong></div><div class="data-row"><span>Total setoran tunai</span><strong data-live="totalDeposit">${money(h.deposit)}</strong></div><div class="box-highlight mt14"><div class="smallcap">SISA HASIL SETELAH SETORAN</div><b data-live="remainder">${money(h.remainder)}</b></div></div><div class="card"><div class="section-title" style="margin:0 0 6px">Setoran Tunai</div>${state.store.deposits.map((v,i)=>`<div class="field" style="display:flex;align-items:end;gap:8px"><div class="grow"><label class="field-label">Setoran ${i+1}</label><div class="input-wrap"><span class="prefix">Rp</span><input data-deposit="${i}" type="text" inputmode="numeric" value="${v?fmt(v):''}" placeholder="0"></div></div><button class="btn danger small" style="min-height:43px" data-del-deposit="${i}" aria-label="Hapus setoran ${i+1}">×</button></div>`).join('')}<button class="inline-add" data-action="add-deposit">＋ Tambah setoran</button></div><div class="card"><div class="section-title" style="margin:0 0 8px">Settlement per Shift</div>${field('eTrans Shift 1 (settlement)','etransShift1')}${field('PLN Shift 1 (settlement)','plnShift1')}<div class="data-row"><span>eTrans Shift 2 (selisih)</span><strong data-live="etrans2">${money(h.etrans2)}</strong></div><div class="data-row"><span>PLN Shift 2 (selisih)</span><strong data-live="pln2">${money(h.pln2)}</strong></div><div class="data-row"><span>Selisih eTrans (rumus Excel asli)</span><strong data-live="diffE">${money(h.diffE)}</strong></div><div class="data-row"><span>Selisih PLN (rumus Excel asli)</span><strong data-live="diffP">${money(h.diffP)}</strong></div><div class="section-title" style="font-size:13px;margin-top:15px">Pengecekan selisih per shift</div>${[['diffE1','eTrans Shift 1'],['diffE2','eTrans Shift 2'],['diffP1','PLN Shift 1'],['diffP2','PLN Shift 2']].map(([k,label])=>`<div class="data-row"><span>${label}</span><strong data-live="${k}">${money(h[k])}</strong></div>`).join('')}</div><div class="notice">Selisih <strong>eTrans dan PLN versi Excel asli</strong> mengikuti referensi sel pada spreadsheet. Untuk audit, bandingkan juga selisih per shift.</div><div class="row-actions"><button class="btn primary" data-action="archive">${icon('save',17)} Simpan</button><button class="btn" data-action="copy">${icon('copy',17)} Salin Rekap</button></div>`}
function historyScreen(){let filtered=history.map((x,i)=>({x,i})).filter(({x})=>!query||String(x.date||'').includes(query.toLowerCase())||niceDate(x.date||today()).toLowerCase().includes(query.toLowerCase())||(x.shifts||[]).some(s=>(s.cashiers||[]).some(c=>(c.name||'').toLowerCase().includes(query.toLowerCase()))));return `<input class="search-input" data-search="1" aria-label="Cari riwayat" placeholder="⌕  Cari tanggal atau nama kasir..." value="${esc(query)}"><div class="history-controls"><button class="btn primary" data-action="archive">${icon('save',16)} Simpan Hari Ini</button><button class="btn" data-action="json-export">${icon('copy',16)} Backup</button></div><div id="history-list">${historyList(filtered)}</div><div class="notice mt14">Data tersimpan pada penyimpanan lokal browser, tidak pada server. <strong>Backup secara berkala</strong> untuk mencegah kehilangan data.</div>`}
function historyList(filtered){return filtered.length?filtered.map(({x,i})=>{let n=historyTotal(x);return `<div class="history-row"><span class="menu-ico" style="height:36px;width:36px">${icon('calendar',19)}</span><div class="grow"><div class="history-date">${esc(shortDate(x.date))}</div><div class="hint">4 kasir · 2 shift</div></div><div style="text-align:right"><div class="history-total ${n<0?'neg':''}">${money(n)}</div><div style="display:flex;justify-content:end;gap:7px;margin-top:7px"><button class="btn small" data-restore="${i}">Buka</button><button class="btn small danger" data-remove-history="${i}" aria-label="Hapus riwayat ${esc(x.date)}">×</button></div></div></div>`}).join(''):`<div class="card empty"><div style="font-size:34px">◷</div><strong>${history.length?'Tidak ada hasil pencarian':'Belum ada riwayat'}</strong><div class="hint">Tekan “Simpan Hari Ini” setelah menghitung kasir.</div></div>`}
function menuItem(symbol,label,desc,action,color=''){return `<button class="menu-item" data-action="${action}"><span class="menu-ico ${color}">${symbol}</span><span class="grow"><span class="menu-title">${label}</span><span class="menu-sub" style="display:block">${desc}</span></span><span class="chevron">›</span></button>`}
function moreScreen(){return `${menuItem(icon('plus',20),'Pasang ke Layar Utama','Buka seperti aplikasi, tanpa bilah Chrome','install-pwa','green')}${menuItem('🎨','Tema & Tampilan','Ganti warna dan ukuran UI','open-settings','purple')}${menuItem(icon('calendar',20),'Ganti Tanggal','Pilih tanggal data aktif','change-date')}${menuItem(icon('calc',20),'Rekap per Kasir','Total Pickup, eTrans, PLN, dan Klerek','open-recap')}${menuItem(icon('wallet',20),'Input Kepala Toko','Sales report, settlement, dan setoran','open-store','orange')}${menuItem(icon('save',20),'Simpan ke Riwayat','Simpan perhitungan hari ini','archive','green')}${menuItem(icon('file',20),'Backup Data ke File','Unduh cadangan JSON ke perangkat','json-export','green')}${menuItem(icon('copy',20),'Salin Kode Cadangan','Salin data jika unduhan tidak tersedia','json-copy','gray')}${menuItem(icon('file',20),'Pulihkan Data dari File','Pilih cadangan JSON dari perangkat','json-import','green')}${menuItem(icon('copy',20),'Tempel Kode Cadangan','Pulihkan backup salinan dari versi lama','json-paste','gray')}${menuItem(icon('file',20),'Ekspor ke Excel (CSV)','Unduh laporan yang bisa dibuka Excel','csv-export','orange')}${menuItem(icon('copy',20),'Salin Rekap','Salin laporan untuk WhatsApp','copy','purple')}${menuItem(icon('settings',20),'Pengaturan & Data','Tema, tampilan, dan penyimpanan','open-settings','gray')}<div class="footer-note">Klerek Kasir · Multi Tema v3.1<br>Offline · Semua data dikelola di perangkat Anda.</div>`}

function appearanceScreen(){
 let themeCards=THEMES.map(t=>`<button type="button" class="theme-choice ${preferences.theme===t.id?'is-active':''}" data-theme="${t.id}" aria-label="Pilih tema ${t.name}" aria-pressed="${preferences.theme===t.id}"><div class="swatches">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div>${preferences.theme===t.id?'<span class="selected-check">✓</span>':''}<div class="theme-name">${t.name}</div><div class="theme-description">${t.desc}</div></button>`).join('');
 let layouts=LAYOUTS.map(t=>`<button type="button" class="layout-choice ${preferences.layout===t.id?'is-active':''}" data-layout="${t.id}" aria-label="Tampilan ${t.name}" aria-pressed="${preferences.layout===t.id}"><div class="layout-pictogram"><i></i><i></i><i></i></div><div class="layout-name">${t.name}</div><div class="layout-help">${t.desc}</div></button>`).join('');
 return `<div class="card"><div class="section-title" style="margin:0 0 5px">🎨 Ganti Tema</div><p class="appearance-intro">Pilih warna aplikasi. Perubahan terlihat langsung dan pilihan disimpan otomatis.</p><div class="theme-grid">${themeCards}</div></div><div class="card"><div class="section-title" style="margin:0 0 5px">📱 Gaya Tampilan (UI)</div><p class="appearance-intro">Ubah ukuran kartu, tombol, serta jarak antarbagian.</p><div class="layout-grid">${layouts}</div><div class="appearance-note">✓ Mengganti tema atau gaya tampilan tidak mengubah nominal maupun riwayat kasir.</div></div>`;
}
function settingsScreen(){return `<div class="card"><div class="section-title" style="margin-top:0">📱 Instal Aplikasi Offline</div><p class="hint">Setelah PWA dipasang dari situs HTTPS, perhitungan dapat digunakan tanpa koneksi internet. Data disimpan hanya di perangkat ini.</p><button class="btn full primary" data-action="install-pwa">${icon('plus',17)} Pasang di Layar Utama</button></div>${appearanceScreen()}<div class="card"><div class="section-title" style="margin-top:0">Penyimpanan</div><div class="data-row"><span>Mode</span><strong>Offline</strong></div><div class="data-row"><span>Riwayat tersimpan</span><strong>${history.length} hari</strong></div><div class="data-row"><span>Rumus</span><strong>Pickup − eTrans − PLN</strong></div><div class="hint mt14">Penyimpanan otomatis menggunakan <strong>localStorage</strong>. Saat file HTML dipindah, diganti nama, dibuka di browser lain, atau data browser dihapus, data lama mungkin tidak terbaca. Simpan backup sebagai file JSON.</div></div><div class="card"><div class="section-title" style="margin-top:0">Kelola Data</div><button class="btn full primary" data-action="new">${icon('plus',17)} Mulai Perhitungan Baru</button><button class="btn full mt10" data-action="json-export">${icon('save',17)} Backup Sekarang</button><button class="btn full mt10 danger" data-action="erase">${icon('trash',17)} Hapus Seluruh Data</button></div>`}
const tabs=[['dashboard','Beranda','home'],['calc','Perhitungan','calc'],['history','Riwayat','clock'],['more','Lainnya','dots']];
function header(){if(page==='dashboard')return `<div class="brandrow"><div class="logo">${icon('calc',30)}</div><div class="grow"><div class="brandtitle">KLEREK KASIR</div><div class="brandsub">Perhitungan Kasir Harian · Offline</div></div><button class="icon-button" data-go="settings" aria-label="Pengaturan">${icon('settings',20)}</button></div>`;let titles={calc:'Perhitungan Kasir',recap:'Rekap Kasir',store:'Rekap Kepala Toko',history:'Riwayat Perhitungan',more:'Lainnya',settings:'Pengaturan'};return `<div class="page-head"><button class="back" data-go="${['recap','store','settings'].includes(page)?'more':'dashboard'}" aria-label="Kembali">${icon('back',24)}</button><div class="grow"><div class="page-title">${titles[page]}</div><div class="page-subtitle">${page==='calc'?'Input kasir Shift 1 dan Shift 2':page==='history'?'Riwayat tersimpan di perangkat':'KLEREK KASIR · Multi Tema'}</div></div><span class="saved">● Offline</span></div>`}
function render(){document.getElementById('header').innerHTML=header();document.getElementById('nav').innerHTML=tabs.map(([id,name,ico])=>`<button class="nav ${page===id||((page==='recap'||page==='store')&&id==='more')?'active':''}" data-go="${id}" aria-label="${name}">${icon(ico,23)}<span>${name}</span></button>`).join('');document.getElementById('screen').innerHTML=page==='dashboard'?dashboard():page==='calc'?calcScreen():page==='history'?historyScreen():page==='recap'?recapScreen():page==='store'?storeScreen():page==='settings'?settingsScreen():moreScreen()}
function navigate(s){page=s;render();window.scrollTo(0,0)}
function refresh(){stored=true;if(page==='calc'){let si=selectedShift;state.shifts[si].cashiers.forEach((c,j)=>{let t=totals(c),prefix=`s${si}c${j}`;for(let key of ['pickup','etrans','pln','net']){let a=document.querySelector(`[data-live="${prefix}${key}"]`);if(a)a.textContent=money(t[key])}let badge=document.getElementById(`badge-${si}_${j}`);if(badge)badge.textContent=t.net===0?'SEIMBANG':t.net>0?'LEBIH':'KURANG';let box=document.getElementById(`netbox-${si}_${j}`);if(box)box.classList.toggle('negative',t.net<0)});for(let k of ['pickup','etrans','pln','net']){let a=document.querySelector(`[data-live="shift${si+1}${k}"]`);if(a)a.textContent=money(rollup(k,si))}}else if(page==='store'){let h=headTotals();for(let k of Object.keys(h)){let a=document.querySelector(`[data-live="${k}"]`);if(a)a.textContent=money(h[k])}}save()}
function notify(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),2800)}
function archive(){let snapshot=clone(state);history=history.filter(h=>h.date!==snapshot.date);history.unshift(snapshot);history=history.slice(0,365);if(save()){stored=true;notify('Perhitungan tersimpan ke riwayat')}else notify('Gagal menyimpan. Buat backup data.');render()}
function newData(){if(!confirm('Simpan data aktif ke riwayat dan mulai perhitungan baru?'))return;archive();let oldNames=state.shifts.map(s=>s.cashiers.map(c=>c.name));state=clone(NEW);state.date=today();for(let i=0;i<2;i++)for(let j=0;j<2;j++)state.shifts[i].cashiers[j].name=oldNames[i][j];stored=true;save();selectedShift=0;navigate('calc');notify('Perhitungan baru siap diisi')}
function recapText(){let h=headTotals(),rows=['REKAP KLEREK KASIR','Tanggal: '+niceDate(state.date),''];state.shifts.forEach((s,i)=>{rows.push('SHIFT '+(i+1));s.cashiers.forEach((c,j)=>{let t=totals(c);rows.push(`${j+1}. ${c.name}`,`Pickup: ${money(t.pickup)} | eTrans: ${money(t.etrans)} | PLN: ${money(t.pln)}`,`KLEREK: ${money(t.net)}`)});rows.push('')});rows.push('TOTAL KLEREK: '+money(rollup('net')),'TOTAL PICKUP: '+money(rollup('pickup')),'TOTAL ETRANS: '+money(rollup('etrans')),'TOTAL PLN: '+money(rollup('pln')),'SETORAN TUNAI: '+money(h.deposit),'SETTLE ETRANS: '+money(state.store.settleEtrans),'SETTLE PLN: '+money(state.store.settlePln),'SELISIH ETRANS (EXCEL): '+money(h.diffE),'SELISIH PLN (EXCEL): '+money(h.diffP));return rows.join('\n')}
function copyText(v,msg){let a=document.createElement('textarea');a.value=v;a.style.cssText='position:fixed;left:-5000px;top:0';document.body.appendChild(a);a.select();let success=false;try{success=document.execCommand('copy')}catch(e){}a.remove();if(success){notify(msg);return}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>notify(msg),()=>prompt('Salin teks berikut:',v));else prompt('Salin teks berikut:',v)}
function download(str,filename,mime){try{let blob=new Blob([str],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),12000);notify('File disiapkan. Periksa folder Download.')}catch(e){notify('Unduhan gagal. Gunakan Salin Kode Cadangan.')}}
function backup(){return JSON.stringify({version:4,app:'KLEREK KASIR',active:state,history,preferences},null,2)}
function restore(content){try{let data=JSON.parse(content);if(!data.active||!Array.isArray(data.active.shifts))throw Error('format');if(!confirm('Pulihkan data dari cadangan? Data aktif dan riwayat saat ini akan diganti.'))return;state=data.active;history=Array.isArray(data.history)?data.history:[];if(data.preferences&&typeof data.preferences==='object'){preferences={...preferences,...data.preferences};applyAppearance()}normalize();stored=true;save();navigate('dashboard');notify('Cadangan berhasil dipulihkan')}catch(e){notify('Cadangan tidak valid. Gunakan JSON Klerek Kasir.')}}
function csvExport(){let lines=[['Tanggal','Shift','Kasir','Pickup','eTrans','PLN','Klerek']];state.shifts.forEach((s,i)=>s.cashiers.forEach((c,j)=>{let t=totals(c);lines.push([state.date,i+1,c.name,t.pickup,t.etrans,t.pln,t.net])}));lines.push(['TOTAL','','',rollup('pickup'),rollup('etrans'),rollup('pln'),rollup('net')]);let h=headTotals();lines.push([]);lines.push(['KEPALA TOKO','Nominal']);for(let [n,v] of [['Sales Report',state.store.sales],['Settle eTrans',state.store.settleEtrans],['Settle PLN',state.store.settlePln],['Total Setoran Tunai',h.deposit],['Subtotal',h.subtotal],['Hasil setelah setoran',h.remainder],['Selisih eTrans Excel',h.diffE],['Selisih PLN Excel',h.diffP]])lines.push([n,v]);let csv='\uFEFFsep=;\r\n'+lines.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');download(csv,'Rekap_Klerek_Kasir_'+state.date+'.csv','text/csv;charset=utf-8')}
function doAction(a){if(a==='install-pwa'){installPwa();return}if(a==='archive'){archive()}else if(a==='new')newData();else if(a==='reset-shift'){if(confirm('Kosongkan semua nominal pada Shift '+(selectedShift+1)+'?')){for(let c of state.shifts[selectedShift].cashiers)c.rows=[{pickup:0,etrans:0,pln:0}];save();render();notify('Nominal shift dikosongkan')}}else if(a==='copy')copyText(recapText(),'Rekap disalin ke clipboard');else if(a==='json-export')download(backup(),'Backup_Klerek_Kasir_'+state.date+'.json','application/json');else if(a==='json-copy')copyText(backup(),'Kode cadangan disalin');else if(a==='json-import')document.getElementById('import-file').click();else if(a==='json-paste'){let t=prompt('Tempel kode cadangan JSON Klerek Kasir:','');if(t)restore(t)}else if(a==='csv-export')csvExport();else if(a==='open-recap')navigate('recap');else if(a==='open-store')navigate('store');else if(a==='open-settings')navigate('settings');else if(a==='add-deposit'){state.store.deposits.push(0);save();render()}else if(a==='erase'){if(confirm('PERINGATAN: Semua data aktif dan riwayat akan dihapus. Lanjutkan?')&&confirm('Yakin hapus seluruh data?')){history=[];state=clone(NEW);stored=true;save();navigate('dashboard');notify('Data dihapus')}}else if(a==='change-date'){navigate('dashboard');let el=document.querySelector('[data-date]');if(el){el.focus();if(el.showPicker)try{el.showPicker()}catch(e){}}}}
function changeDate(v){if(!v)return;state.date=v;stored=true;save();render();notify('Tanggal telah diubah')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.theme){changeAppearance('theme',d.theme);return}if(d.layout){changeAppearance('layout',d.layout);return}if(d.go){navigate(d.go);return}if(d.shift!==undefined){selectedShift=+d.shift;render();return}if(d.edit){let [si]=d.edit.split(',').map(Number);selectedShift=si;navigate('calc');return}if(d.action){doAction(d.action);return}if(d.add){let[si,ci]=d.add.split(',').map(Number);state.shifts[si].cashiers[ci].rows.push({pickup:0,etrans:0,pln:0});save();render();return}if(d.delete){let[si,ci,ri]=d.delete.split(',').map(Number),r=state.shifts[si].cashiers[ci].rows;if(r.length===1)r[0]={pickup:0,etrans:0,pln:0};else r.splice(ri,1);save();render();return}if(d.delDeposit!==undefined){let i=+d.delDeposit;state.store.deposits.length===1?state.store.deposits[0]=0:state.store.deposits.splice(i,1);save();render();return}if(d.restore!==undefined){let snap=history[+d.restore];if(snap&&confirm('Buka riwayat '+shortDate(snap.date)+'? Data aktif saat ini akan disimpan terlebih dahulu.')){archive();state=clone(snap);normalize();save();stored=true;navigate('dashboard')}return}if(d.removeHistory!==undefined&&confirm('Hapus riwayat ini secara permanen?')){history.splice(+d.removeHistory,1);save();render()}});
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.money){let[si,ci,ri,k]=d.money.split(',');state.shifts[+si].cashiers[+ci].rows[+ri][k]=readN(e.target.value);refresh()}else if(d.name){let[si,ci]=d.name.split(',').map(Number);state.shifts[si].cashiers[ci].name=e.target.value;save()}else if(d.store){state.store[d.store]=readN(e.target.value);refresh()}else if(d.deposit!==undefined){state.store.deposits[+d.deposit]=readN(e.target.value);refresh()}else if(d.search!==undefined){query=e.target.value.toLowerCase();let v=history.map((x,i)=>({x,i})).filter(({x})=>!query||String(x.date||'').includes(query)||niceDate(x.date||today()).toLowerCase().includes(query)||(x.shifts||[]).some(s=>(s.cashiers||[]).some(c=>(c.name||'').toLowerCase().includes(query))));let holder=document.getElementById('history-list');if(holder)holder.innerHTML=historyList(v)}});
document.addEventListener('focusout',e=>{let d=e.target.dataset;if(d.money||d.store||d.deposit!==undefined){let n;if(d.money){let[si,ci,ri,k]=d.money.split(',');n=state.shifts[+si].cashiers[+ci].rows[+ri][k]}else if(d.store)n=state.store[d.store];else n=state.store.deposits[+d.deposit];e.target.value=n?fmt(n):''}});
document.addEventListener('change',e=>{if(e.target.dataset.date!==undefined)changeDate(e.target.value);if(e.target.id==='import-file'){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>restore(r.result);r.onerror=()=>notify('Tidak dapat membaca file cadangan');r.readAsText(f);e.target.value=''}});
// Instalasi PWA: data dan semua fitur lain tetap berfungsi tanpa fitur instal ini.
let pendingInstallEvent=null;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function installPwa(){
 if(isStandalone()){notify('Aplikasi sudah terpasang di HP ini.');return}
 if(pendingInstallEvent){
   const event=pendingInstallEvent;pendingInstallEvent=null;
   event.prompt();
   event.userChoice.then(({outcome})=>{if(outcome==='accepted')notify('Aplikasi ditambahkan ke layar utama.');else notify('Pemasangan dibatalkan.');}).catch(()=>notify('Silakan gunakan menu Instal aplikasi di Chrome.'));
   return;
 }
 alert('Untuk memasang PWA: buka aplikasi dari alamat web HTTPS melalui Chrome, lalu pilih menu ⋮ > Instal aplikasi atau Tambahkan ke layar utama.\n\nFile .html di folder Download tetap bisa dipakai offline, tetapi tidak bisa diinstal sebagai PWA langsung dari file lokal.');
}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingInstallEvent=event});
window.addEventListener('appinstalled',()=>{pendingInstallEvent=null;if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});notify('KLEREK KASIR terpasang. Bisa digunakan offline.');});
if(!stored)save();render();
})();
</script>
<script>
/* Service worker hanya tersedia untuk origin HTTPS / localhost, bukan file://. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .catch(err => console.warn('Mode PWA belum aktif, aplikasi tetap bisa digunakan:', err));
  });
}
</script>
