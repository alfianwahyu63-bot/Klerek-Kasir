/* Make every palette apply to complete app rather than changing accent only. */
html{background:var(--bg);color-scheme:dark}
:root[data-theme="modern-blue"],:root[data-theme="pos-orange"],:root[data-theme="minimal-light"]{color-scheme:light}
body{background:radial-gradient(ellipse 700px 360px at 50% -180px,var(--body-glow),transparent),var(--bg);color:var(--white)}
input{color:var(--white)}
.logo{background:linear-gradient(143deg,var(--accent-a),var(--accent-b));box-shadow:0 9px 20px color-mix(in srgb,var(--blue) 20%,transparent)}
.icon-button{color:var(--white)}.back{color:var(--white)}
.date-box{background:linear-gradient(110deg,var(--panel-c),var(--panel-b))}.date-control{color:var(--white);color-scheme:inherit}

/* theme & layout controls */

#print-report{display:none}.pin-overlay[hidden],#print-report[hidden]{display:none!important}

}

{id:'premium-dark',name:'Premium Dark',desc:'Navy • biru elektrik',sw:['#071321','#13243a','#1178ff']},

// Migrasi aman dari v3.4: data Kasir ke-3 Shift 3 tidak hilang.
// Dicatat sebagai arsip lama (tidak lagi menjadi slot kasir aktif).
function migrateLegacyShift3(day){
 if(!day||!Array.isArray(day.shifts)||!Array.isArray(day.shifts[2]?.cashiers))return day;
 const cash=day.shifts[2].cashiers;
 if(cash.length>CASHIER_COUNTS[2]){
  const legacy=cash.slice(CASHIER_COUNTS[2]).map(clone);
  const meaningful=legacy.filter((c,i)=>Array.isArray(c.rows)&&c.rows.some(r=>readN(r.pickup)||readN(r.etrans)||readN(r.pln))||String(c.name||'')!=='Kasir '+(i+3));
  if(meaningful.length)day.legacyShift3Cashiers=[...(day.legacyShift3Cashiers||[]),...meaningful];
  cash.length=CASHIER_COUNTS[2];
 }
 return day;
}
// v4.1: settlement per tanggal kerja dan per shift, terpisah dari transaksi kedua kasir.
function settledNumber(n){if(n===null||n===undefined||n==='')return null;let v=Number(n);return Number.isSafeInteger(v)&&v>=0?v:null}
function shiftSettlement(day,si){let p=day?.shifts?.[si]?.settlement||{};return {etrans:settledNumber(p.etrans),pln:settledNumber(p.pln)}}
function shiftCompare(day,si,key){let cash=sum((day?.shifts?.[si]?.cashiers||[]).map(c=>totals(c)[key]));let settlement=shiftSettlement(day,si)[key];return {cash,settlement,diff:settlement===null?null:cash-settlement}}
function shiftDiffStatus(diff){return diff===null?'BELUM DIISI':diff===0?'SESUAI':diff>0?'LEBIH':'KURANG'}
function settlementLabel(v){return v===null?'Belum diisi':money(v)}
function canEditShiftSettlement(si){
 if(!cloud?.ready)return true;
 if(!V4.ready||V4.patchMissing)return false;
 if([0,1].some(ci=>v4GetStatus(state.date,si,ci).status==='approved'))return false;
 if(['admin','kepala_toko'].includes(cloud.role))return true;
 return cloud.role==='kasir'&&[0,1].some(ci=>v4AssignedToMe(si,ci)&&v4CanEdit(si,ci));
}
function shiftSettlementCard(si){
 let e=shiftCompare(state,si,'etrans'),p=shiftCompare(state,si,'pln'),editable=canEditShiftSettlement(si);
 const field=(key,title,x)=>`<div class="settle-item"><div class="settle-item-heading">${title}</div><div class="data-row"><span>Kasir 1 + Kasir 2</span><strong data-settle-live="${si},${key},cash">${money(x.cash)}</strong></div><label class="field-label" for="shift-settle-${si}-${key}">Input Settlement ${title} Shift ${si+1}</label><div class="input-wrap"><span class="prefix">Rp</span><input id="shift-settle-${si}-${key}" data-shift-settlement="${si},${key}" type="text" inputmode="numeric" autocomplete="off" value="${x.settlement===null?'':fmt(x.settlement)}" placeholder="Belum diisi" ${editable?'':'disabled'}></div><div class="settle-result ${x.diff===null?'unset':x.diff===0?'matched':x.diff>0?'excess':'shortage'}" data-settle-result="${si},${key}"><div><small>SELISIH ${title.toUpperCase()}</small><strong data-settle-live="${si},${key},status">${shiftDiffStatus(x.diff)}</strong></div><b data-settle-live="${si},${key},diff">${settlementLabel(x.diff)}</b></div></div>`;
 return `<section class="card shift-settle-card"><div class="section-title" style="margin:0 0 8px">🧾 Settlement Shift ${si+1}</div><p class="hint">Bandingkan total eTrans dan PLN <b>Kasir 1 + Kasir 2</b> dengan settlement shift. Selisih = total kasir − settlement.</p>${field('etrans','eTrans',e)}${field('pln','PLN',p)}<div class="hint mt10">${editable?'Nominal disimpan otomatis. Kosongkan untuk menandai belum diinput.':'Hanya baca — akun tidak memiliki izin, atau sudah ada laporan yang disetujui.'}${cloud?.ready?' Sinkron melalui Cloud jika tersambung.':''}</div></section>`;
}
function refreshShiftSettlement(si){
 for(let key of ['etrans','pln']){
  let x=shiftCompare(state,si,key);
  for(const [kind,value] of Object.entries({cash:money(x.cash),diff:settlementLabel(x.diff),status:shiftDiffStatus(x.diff)})){
   let el=document.querySelector(`[data-settle-live="${si},${key},${kind}"]`);if(el)el.textContent=value;
  }
  let el=document.querySelector(`[data-settle-result="${si},${key}"]`);
  if(el)el.className='settle-result '+(x.diff===null?'unset':x.diff===0?'matched':x.diff>0?'excess':'shortage');
 }
}
function settlementLines(day){return [0,1,2].flatMap(si=>['etrans','pln'].map(key=>{let x=shiftCompare(day,si,key);return [day.date,'SHIFT '+(si+1),key.toUpperCase(),x.cash,x.settlement===null?'BELUM DIISI':x.settlement,x.diff===null?'BELUM DIISI':x.diff,shiftDiffStatus(x.diff)]}))}
function settlementText(day=state){return [0,1,2].map(si=>{let e=shiftCompare(day,si,'etrans'),p=shiftCompare(day,si,'pln');return `SHIFT ${si+1} · SETTLEMENT\neTrans kasir: ${money(e.cash)} | Settle: ${settlementLabel(e.settlement)} | Selisih: ${settlementLabel(e.diff)} (${shiftDiffStatus(e.diff)})\nPLN kasir: ${money(p.cash)} | Settle: ${settlementLabel(p.settlement)} | Selisih: ${settlementLabel(p.diff)} (${shiftDiffStatus(p.diff)})`}).join('\n')}

function normalize(){
 if(!Array.isArray(state.shifts))state.shifts=[];
 migrateLegacyShift3(state);
 const migrated=state.shifts.length<3;
 for(let i=0;i<3;i++){
  if(!state.shifts[i]||typeof state.shifts[i]!=='object')state.shifts[i]=clone(NEW.shifts[i]);
  if(!Array.isArray(state.shifts[i].cashiers))state.shifts[i].cashiers=[];
  for(let j=0;j<CASHIER_COUNTS[i];j++){
   if(!state.shifts[i].cashiers[j]||typeof state.shifts[i].cashiers[j]!=='object')state.shifts[i].cashiers[j]=freshCashier(j);
   let c=state.shifts[i].cashiers[j];
   if(!Array.isArray(c.rows)||!c.rows.length)c.rows=[{pickup:0,etrans:0,pln:0}];
   if(typeof c.name!=='string')c.name='Kasir '+(j+1);
  }
  state.shifts[i].cashiers.length=CASHIER_COUNTS[i];
  state.shifts[i].settlement=shiftSettlement(state,i);
 }
 state.shifts.length=3;
 state.store={...NEW.store,...(state.store||{})};
 if(migrated){ // Previously Shift 2 was derived from the remaining settlement; keep that allocation.
  state.store.etransShift2=(+state.store.settleEtrans||0)-(+state.store.etransShift1||0);
  state.store.plnShift2=(+state.store.settlePln||0)-(+state.store.plnShift1||0);
 }
 if(!Array.isArray(state.store.deposits)||!state.store.deposits.length)state.store.deposits=[0];
 if(!/^\d{4}-\d{2}-\d{2}$/.test(state.date||''))state.date=today();
}
normalize();
history.forEach(migrateLegacyShift3);
function save(){try{let suffix=(cloud&&cloud.storeId)?'_cloud_'+cloud.storeId:'';localStorage.setItem(DATA_KEY+suffix,JSON.stringify(state));localStorage.setItem(HISTORY_KEY+suffix,JSON.stringify(history));return true}catch(e){return false}}
function totals(c){let rows=Array.isArray(c&&c.rows)?c.rows:[];let p=sum(rows.map(r=>r.pickup)),e=sum(rows.map(r=>r.etrans)),l=sum(rows.map(r=>r.pln));return {pickup:p,etrans:e,pln:l,net:p-e-l}}
function rollup(k,si){return sum((si===undefined?state.shifts.flatMap(s=>s.cashiers):state.shifts[si].cashiers).map(c=>totals(c)[k]))}
function headTotals(){
 let s=state.store,deposit=sum(s.deposits),subtotal=(+s.sales||0)+(+s.settleEtrans||0)+(+s.settlePln||0);
 let es=[0,1,2].map(si=>shiftCompare(state,si,'etrans')),ps=[0,1,2].map(si=>shiftCompare(state,si,'pln'));
 return {deposit,subtotal,remainder:subtotal-deposit,
  etrans2:es[1].settlement,pln2:ps[1].settlement,etrans3:es[2].settlement,pln3:ps[2].settlement,
  diffE:rollup('etrans')-(+s.settleEtrans||0),diffP:rollup('pln')-(+s.settlePln||0),
  diffE1:es[0].diff,diffE2:es[1].diff,diffE3:es[2].diff,
  diffP1:ps[0].diff,diffP2:ps[1].diff,diffP3:ps[2].diff};
}

/* v3.3: shift and date model. Active date = accounting date, never start date. */
const STAFF_KEY='klerek_kasir_staff_v1',HOURS_KEY='klerek_kasir_hours_v1',PIN_KEY='klerek_kasir_pin_v1';
const addDays=(str,n)=>{let d=new Date(str+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shift3StartLabel=d=>{let s=addDays(d,-1);return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'short'}).format(new Date(s+'T12:00:00'))};
const businessDateFor=(si,now=new Date())=>{let s=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;return si===2&&now.getHours()>=22?addDays(s,1):s};
let dateManual=false;
let staffNames=state.shifts.map(s=>s.cashiers.map(c=>c.name));
let shiftHours=[{start:'',end:''},{start:'',end:''},{start:'22:00',end:''}];
function validStaff(names){return CASHIER_COUNTS.map((n,i)=>Array.from({length:n},(_,j)=>String(names?.[i]?.[j]||'Kasir '+(j+1)).slice(0,55)))}
function validHours(hours){return [0,1].map(i=>({start:/^\d{2}:\d{2}$/.test(hours?.[i]?.start||'')?hours[i].start:'',end:/^\d{2}:\d{2}$/.test(hours?.[i]?.end||'')?hours[i].end:''})).concat([{start:'22:00',end:''}])}
try{let s=JSON.parse(localStorage.getItem(STAFF_KEY)||'null');if(Array.isArray(s))staffNames=validStaff(s);let h=JSON.parse(localStorage.getItem(HOURS_KEY)||'null');if(Array.isArray(h))shiftHours=validHours(h)}catch(e){}
function saveStaff(){try{let suffix=cloud?.storeId?'_cloud_'+cloud.storeId:'';localStorage.setItem(STAFF_KEY+suffix,JSON.stringify(validStaff(staffNames)));localStorage.setItem(HOURS_KEY+suffix,JSON.stringify(validHours(shiftHours)))}catch(e){notify('Gagal menyimpan pengaturan kasir')}}
function switchDay(target){
 if(state.date===target)return false;
 // Save date that is being left, so switching 22:00 Thu -> accounting Fri never loses Thu.
 history=history.filter(s=>s.date!==state.date);
 history.unshift(clone(state));
 let existing=history.find(s=>s.date===target);
 if(existing){state=clone(existing);normalize()}else{state=clone(NEW);state.date=target;state.shifts.forEach((s,i)=>s.cashiers.forEach((c,j)=>c.name=staffNames[i]?.[j]||c.name))}
 history=history.slice(0,365);stored=true;save();return true;
}
function prepareShiftDate(si){if(dateManual)return;let desired=businessDateFor(si);if(switchDay(desired))notify('Tanggal kerja otomatis: '+shortDate(desired))}
// Recover last day's unsaved working session as a history entry when the app is opened later.
if(state.date!==businessDateFor(selectedShift))switchDay(businessDateFor(selectedShift));
function allDays(){let m=new Map();history.forEach(s=>{if(s&&/^\d{4}-\d{2}-\d{2}$/.test(s.date||''))m.set(s.date,s)});m.set(state.date,state);return [...m.values()].sort((a,b)=>a.date.localeCompare(b.date))}
function itemSummary(day){let out={pickup:0,etrans:0,pln:0,net:0};[...(day.shifts||[]).flatMap(s=>s.cashiers||[]),...(day.legacyShift3Cashiers||[])].forEach(c=>{let t=totals(c);Object.keys(out).forEach(k=>out[k]+=t[k])});return out}
function csvFromRows(lines){return '\uFEFFsep=;\r\n'+lines.map(row=>row.map(v=>{let z=String(v??'');if(/^[=+@-]/.test(z)&&!/^-[0-9]+$/.test(z))z="'"+z;return '"'+z.replace(/"/g,'""')+'"'}).join(';')).join('\r\n')}

function staffScreen(){return `${dateBox()}<div class="notice">Susunan tetap: <strong>Shift 1 = 2 kasir</strong>, <strong>Shift 2 = 2 kasir</strong>, <strong>Shift 3 = 2 kasir</strong>. Nama baru berlaku juga untuk tanggal kerja berikutnya, bukan mengubah riwayat lama.</div>${CASHIER_COUNTS.map((n,i)=>`<section class="card"><div class="section-title" style="margin:0 0 10px">Shift ${i+1} <span class="aux">${n} kasir</span></div>${staffNames[i].map((name,j)=>`<div class="field"><label class="field-label" for="staff${i}-${j}">Kasir ${j+1}</label><div class="input-wrap"><input id="staff${i}-${j}" class="staff-input" data-staff-name="${i},${j}" value="${esc(name)}" maxlength="55" placeholder="Nama kasir"></div></div>`).join('')}${i===2?`<div class="notice">🌙 Mulai tetap <strong>22.00 hari sebelumnya</strong> (tanggal transaksi dicatat ke hari berikutnya). Untuk ${esc(shortDate(state.date))}: mulai ${esc(shift3StartLabel(state.date))} pukul 22.00.</div>`:`<div class="time-grid"><label class="field-label">Jam mulai (opsional)<input type="time" data-shift-time="${i},start" value="${esc(shiftHours[i].start)}"></label><label class="field-label">Jam selesai (opsional)<input type="time" data-shift-time="${i},end" value="${esc(shiftHours[i].end)}"></label></div>`}</section>`).join('')}<p class="hint">Tampilan jam Shift 1 dan 2 hanya sebagai catatan jadwal. Tidak mengubah rumus keuangan.</p>`}

let selectedMonth=today().slice(0,7);
function monthLabel(m){return new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric'}).format(new Date(m+'-15T12:00:00'))}
function monthTotals(month){return allDays().filter(x=>x.date.startsWith(month)).map(itemSummary).reduce((acc,o)=>{for(let k of Object.keys(acc))acc[k]+=o[k];return acc},{pickup:0,etrans:0,pln:0,net:0})}
function barGraph(entries,labelField,maxBars=31){
 if(!entries.length)return '<div class="empty-graph">Belum ada transaksi pada periode ini.</div>';
 let data=entries.slice(-maxBars),positive=data.some(d=>d.value>0),negative=data.some(d=>d.value<0);
 let baseline=positive&&negative?86:negative?24:132;
 let max=Math.max(1,...data.map(d=>Math.abs(d.value))),barW=Math.max(5,Math.min(22,304/data.length-5)),step=304/data.length;
 let available=positive&&negative?64:108;
 let paths=data.map((d,i)=>{let h=d.value===0?0:Math.max(3,Math.abs(d.value)/max*available);let x=12+i*step+(step-barW)/2,y=d.value>=0?baseline-h:baseline;let color=d.value<0?'var(--red)':'var(--blue)';return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${color}"><title>${esc(d.label)}: ${esc(money(d.value))}</title></rect>`}).join('');
 let ticks=data.map((d,i)=>{if(i%Math.max(1,Math.ceil(data.length/7))!==0&&i!==data.length-1)return '';return `<text x="${(12+i*step+step/2).toFixed(1)}" y="166" font-size="9" text-anchor="middle" fill="var(--muted)">${esc(d[labelField])}</text>`}).join('');
 return `<div class="chart-wrap"><svg viewBox="0 0 320 174" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grafik batang transaksi"><line x1="10" y1="${baseline}" x2="316" y2="${baseline}" stroke="var(--border)"/>${paths}${ticks}</svg></div>`;
}
function reportsScreen(){let records=allDays(),days=records.filter(s=>s.date.startsWith(selectedMonth)),total=monthTotals(selectedMonth),months=Array.from({length:6},(_,i)=>{let d=new Date(today().slice(0,7)+'-15T12:00:00');d.setMonth(d.getMonth()-(5-i));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`})
 let daily=days.map(x=>({label:shortDate(x.date),day:x.date.slice(-2),value:itemSummary(x).net}));
 let monthValues=months.map(m=>({label:monthLabel(m),short:m.slice(5),value:monthTotals(m).net}));
 return `${v4MonthlySummary()}<div class="card"><div class="section-title" style="margin:0 0 9px">📅 Periode Laporan</div><input class="report-month" type="month" data-month value="${esc(selectedMonth)}"><div class="hint mt10">Dari tanggal aktif dan riwayat tersimpan (tanggal yang sama tidak dihitung dua kali).</div></div><div class="section-title">Rekap ${esc(monthLabel(selectedMonth))}</div><div class="kpi-grid">${kpi('Pickup',total.pickup,'green','↗')}${kpi('eTrans',total.etrans,'orange','▣')}${kpi('PLN',total.pln,'purple','ϟ')}${kpi('Klerek',total.net,'blue','▤')}</div><div class="card"><div class="section-title" style="margin:0 0 12px">Grafik Harian · Klerek <span class="aux">${days.length} hari</span></div>${barGraph(daily,'day')}<div class="chart-foot">Birunya positif, merah berarti klerek negatif.</div></div><div class="card"><div class="section-title" style="margin:0 0 10px">Grafik Bulanan · 6 Bulan</div>${barGraph(monthValues,'short',6)}<div class="chart-foot">Nilai total klerek per bulan. ${esc(monthLabel(selectedMonth))} dipilih di atas.</div></div><div class="card"><div class="section-title" style="margin:0 0 10px">Rincian per Hari</div>${days.length?days.map(x=>{let v=itemSummary(x);return `<div class="data-row"><span>${esc(shortDate(x.date))}</span><strong>${money(v.net)}</strong></div>`}).join(''):'<div class="hint">Belum ada data di bulan ini.</div>'}</div><div class="row-actions"><button class="btn primary" data-action="csv-month">⬇ CSV Bulan Ini</button><button class="btn" data-action="print-month">📄 Cetak PDF</button></div>`;
}
function monthlyCSV(){let rows=[['Tanggal Kerja','Pickup','eTrans','PLN','Klerek']];allDays().filter(x=>x.date.startsWith(selectedMonth)).forEach(x=>{let a=itemSummary(x);rows.push([x.date,a.pickup,a.etrans,a.pln,a.net])});let v=monthTotals(selectedMonth);rows.push(['TOTAL',v.pickup,v.etrans,v.pln,v.net]);rows.push([],['Tanggal','Shift','Jenis','Total Kasir 1+2','Settlement','Selisih','Status']);for(let x of allDays().filter(x=>x.date.startsWith(selectedMonth)))rows.push(...settlementLines(x));let m=v4MonthAggregates();rows.push([],['RINGKASAN BULAN','Nominal'],['Total Setoran',m.deposits],['Total Settle eTrans',m.settleEtrans],['Total Settle PLN',m.settlePln],['Approval disetujui',m.approved],['Approval tertunda',m.pending],['Lebih Kas Terverifikasi',m.plus],['Kurang Kas Terverifikasi',m.minus]);for(let si=0;si<3;si++)rows.push(['KLEREK SHIFT '+(si+1),m.shifts[si]]);download(csvFromRows(rows),'Laporan_Bulanan_'+selectedMonth+'.csv','text/csv;charset=utf-8')}

function reportHTML(monthly=false){let body;if(monthly){let entries=allDays().filter(x=>x.date.startsWith(selectedMonth));let v=monthTotals(selectedMonth);body=`<h1>Laporan Bulanan Klerek Kasir</h1><p>Periode: ${esc(monthLabel(selectedMonth))}</p><table><thead><tr><th>Tanggal Kerja</th><th>Pickup</th><th>eTrans</th><th>PLN</th><th>Klerek</th></tr></thead><tbody>${entries.map(x=>{let a=itemSummary(x);return `<tr><td>${esc(x.date)}</td>${['pickup','etrans','pln','net'].map(k=>`<td>${esc(money(a[k]))}</td>`).join('')}</tr>`}).join('')}<tr class="total"><td>TOTAL</td>${['pickup','etrans','pln','net'].map(k=>`<td>${esc(money(v[k]))}</td>`).join('')}</tr></tbody></table>`}else{body=`<h1>Rekap Harian Klerek Kasir</h1><p>Tanggal kerja: ${esc(niceDate(state.date))}</p><p>Shift 3 mulai ${esc(shift3StartLabel(state.date))} pukul 22.00, dihitung pada tanggal kerja di atas.</p><table><thead><tr><th>Shift</th><th>Kasir</th><th>Pickup</th><th>eTrans</th><th>PLN</th><th>Klerek</th></tr></thead><tbody>${state.shifts.map((s,i)=>s.cashiers.map(c=>{let x=totals(c);return `<tr><td>${i+1}</td><td>${esc(c.name)}</td>${['pickup','etrans','pln','net'].map(k=>`<td>${esc(money(x[k]))}</td>`).join('')}</tr>`}).join('')).join('')}<tr class="total"><td colspan="2">TOTAL</td>${['pickup','etrans','pln','net'].map(k=>`<td>${esc(money(rollup(k)))}</td>`).join('')}</tr></tbody></table>`}return `<div class="print-doc"><div class="print-brand">KLEREK KASIR · v${APP_VERSION}</div>${body}${monthly?v4PrintMonth():v4PrintDay()}<p class="print-note">Dokumen dibuat dari data lokal perangkat pada ${esc(niceDate(today()))}. Rumus: Pickup − eTrans − PLN.</p></div>`}

function exportReportPNG(share){
 const detail=state.shifts.flatMap((s,i)=>s.cashiers.map(c=>({shift:i+1,name:c.name,...totals(c)})));
 const canvas=document.createElement('canvas'),width=1080,height=450+detail.length*82;canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d');if(!ctx){notify('Perangkat tidak mendukung gambar laporan');return}
 ctx.fillStyle='#f4f8ff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#0e274b';ctx.fillRect(0,0,width,218);
 ctx.textBaseline='top';ctx.fillStyle='#8ac5ff';ctx.font='bold 28px system-ui';ctx.fillText('KLEREK KASIR  •  LAPORAN HARIAN',48,38);
 ctx.fillStyle='#fff';ctx.font='bold 45px system-ui';ctx.fillText(shortDate(state.date),48,91);

async function hashPin(pin,salt){if(!crypto?.subtle)throw Error('crypto unsupported');let bytes=new TextEncoder().encode(salt+':'+pin);let digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}

  await registration.update();
  if(registration.installing||registration.waiting){notify('Versi baru terdeteksi. Tutup dan buka kembali aplikasi.');return}
  notify('Pemeriksaan selesai. Muat ulang halaman untuk memuat versi terbaru.');
 }catch(error){notify('Gagal mengecek pembaruan. Periksa koneksi internet.')}

function cloudError(error,fallback='Gagal menghubungkan Supabase'){
 let m=String(error?.message||error||fallback);
 if(m.includes('CLOUD_CONFLICT'))return 'Data telah diubah pengguna lain';
 if(m.includes('permission denied'))return 'Akses ditolak. Periksa skrip SQL dan role akun';
 if(m.includes('REPORT_LOCKED'))return 'Laporan sudah dikirim atau disetujui. Minta revisi/buka ulang dahulu';
 if(m.includes('SLOT_NOT_ASSIGNED'))return 'Kasir belum ditugaskan ke slot ini. Hubungi Admin';
 if(m.includes('WORKFLOW_CONFLICT'))return 'Status laporan telah diubah pengguna lain. Perbarui terlebih dahulu';
 return m.slice(0,180);
}

async function cloudGetDocs(storeId){

function cloudApplyDoc(row,rerender=true,fromDraft=false){

  state.shifts.forEach((shift,si)=>shift.cashiers.forEach((c,ci)=>{if(!cloud.revisions.has(cashDoc(state.date,si,ci)))c.name=staffNames[si][ci]}));
 }else if(key.startsWith('settlement:')){
  const m=/^settlement:(\d{4}-\d{2}-\d{2}):([123])$/.exec(key);if(!m)return;

  if(!target){target=clone(NEW);target.date=date;target.shifts.forEach((shift,s)=>shift.cashiers.forEach((cash,c)=>cash.name=staffNames[s]?.[c]||cash.name));history.push(target);history.sort((a,b)=>b.date.localeCompare(a.date));}

  if(!target){target=clone(NEW);target.date=date;target.shifts.forEach((shift,si)=>shift.cashiers.forEach((cash,ci)=>cash.name=staffNames[si]?.[ci]||cash.name));history.push(target);history.sort((a,b)=>b.date.localeCompare(a.date));}
  if(kind==='cashier'){

   if(si===2&&ci===2){ // Arsip akun versi lama: dibaca saja, slot ke-3 tidak bisa diedit.
    target.legacyShift3Cashiers=[{name:String(payload.name||'Kasir 3 (arsip)').slice(0,55),rows:payload.rows.slice(0,100).map(r=>({pickup:readN(r.pickup),etrans:readN(r.etrans),pln:readN(r.pln)}))}];

   }

async function cloudRefreshDocs(full){

     let q=cloud.client.from('klerek_documents').select('doc_key,payload,revision,updated_at,updated_by').eq('store_id',cloud.storeId);
     if(last)q=q.gte('updated_at',last);

     if(error)throw error;out.push(...(data||[]));if((data||[]).length<500)break;

   })();

   if(cloud.pending.has(key)){if(row.updated_by===cloud.user?.id&&cloud.sending.has(key))continue;cloud.revisions.set(key,rev);cloud.conflicts.set(key,true);continue}
   cloudApplyDoc(row,false);
  }

async function cloudFlushKey(key){
 if(!cloud?.ready||!navigator.onLine||cloud.sending.has(key)||cloud.conflicts.has(key))return;
 if(key.startsWith('settlement:')){let p=key.split(':');if(!canEditShiftSettlement(Number(p[2])-1)){cloud.conflicts.set(key,true);cloudUpdateBadge();return}}
 if(key.startsWith('cashier:')){let p=key.split(':');if(!v4CanEdit(Number(p[2])-1,Number(p[3])-1,p[1])){cloud.conflicts.set(key,true);cloudUpdateBadge();return}}
 cloud.sending.add(key);
 let storeId=cloud.storeId;
 try{
  while(cloud?.ready&&cloud.storeId===storeId&&cloud.pending.has(key)&&!cloud.conflicts.has(key)){
   const item=cloud.pending.get(key),snapshot=JSON.stringify(item.payload);
   const {data,error}=await cloud.client.rpc('klerek_put_document',{p_store_id:storeId,p_doc_key:key,p_payload:item.payload,p_expected_revision:item.expected});
   if(error){
    if(['CLOUD_CONFLICT','REPORT_LOCKED','SLOT_NOT_ASSIGNED'].some(x=>String(error.message||'').includes(x))){cloud.conflicts.set(key,true);notify('⚠ Edit tidak dapat dikirim ('+key+'). Periksa status approval/slot di menu Cloud.');}
    else {console.warn('Sync:',error);notify('Sinkronisasi tertunda: '+cloudError(error));}
    break;
   }
   const row=data?.[0],revision=Number(row?.revision)||item.expected+1;
   cloud.revisions.set(key,revision);
   const current=cloud.pending.get(key);
   if(current&&JSON.stringify(current.payload)===snapshot){cloud.pending.delete(key);}
   else if(current){current.expected=revision;cloud.pending.set(key,current)}
   cloudPersistDrafts();
  }
 }catch(error){notify('Belum berhasil mengirim perubahan ke cloud')}
 finally{cloud.sending.delete(key);cloudPersistDrafts()}
}

function v4MonthAggregates(){
 const days=allDays().filter(x=>x.date.startsWith(selectedMonth));const out={deposits:0,settleEtrans:0,settlePln:0,shifts:[0,0,0],approved:0,pending:0,plus:0,minus:0};
 for(const day of days){out.deposits+=sum(day.store?.deposits||[]);out.settleEtrans+=Number(day.store?.settleEtrans)||0;out.settlePln+=Number(day.store?.settlePln)||0;
  for(let si=0;si<3;si++){out.shifts[si]+=sum((day.shifts?.[si]?.cashiers||[]).map(c=>totals(c).net));for(let ci=0;ci<2;ci++){let w=v4GetStatus(day.date,si,ci);if(w.status==='approved')out.approved++;else if(w.status==='submitted'||w.status==='revision')out.pending++;}}
 }
 for(let r of v4DifferenceRows()){out.plus+=Math.max(0,r.diff);out.minus+=Math.max(0,-r.diff)}return out;
}
function v4MonthlySummary(){let m=v4MonthAggregates();return `<section class="card"><div class="section-title" style="margin:0 0 7px">📊 Ringkasan Bulanan Lengkap</div><div class="data-row"><span>Setoran tunai</span><strong>${money(m.deposits)}</strong></div><div class="data-row"><span>Settle eTrans</span><strong>${money(m.settleEtrans)}</strong></div><div class="data-row"><span>Settle PLN</span><strong>${money(m.settlePln)}</strong></div>${m.shifts.map((x,i)=>`<div class="data-row"><span>Klerek Shift ${i+1}</span><strong>${money(x)}</strong></div>`).join('')}<div class="data-row"><span>Approval (setuju/tertunda)</span><b>${m.approved}/${m.pending}</b></div><div class="data-row"><span>Kelebihan / Kekurangan kas aktual</span><b>${money(m.plus)} / ${money(m.minus)}</b></div><div class="hint mt10">Setoran dan settlement dari input kepala toko. Approval dan selisih terverifikasi hanya lengkap jika data cloud tersedia.</div><button class="btn full mt10" data-go="v4-differences">Detail Selisih Per Kasir →</button></section>`}
function v4PrintMonth(){let m=v4MonthAggregates();return `<h2>Ringkasan Settlement & Approval</h2><table><tbody>${[['Setoran tunai',m.deposits],['Settle eTrans',m.settleEtrans],['Settle PLN',m.settlePln],['Klerek Shift 1',m.shifts[0]],['Klerek Shift 2',m.shifts[1]],['Klerek Shift 3',m.shifts[2]],['Kas Lebih Terverifikasi',m.plus],['Kas Kurang Terverifikasi',m.minus]].map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(money(v))}</td></tr>`).join('')}<tr><td>Approval (setuju/tertunda)</td><td>${m.approved} / ${m.pending}</td></tr></tbody></table>`}
function v4PrintDay(){let c=v4Counts();return `<h2>Status Laporan Shift</h2><p>Disetujui ${c.approved}/6 · Menunggu ${c.submitted} · Revisi ${c.revision} · Belum ${c.draft}</p><h2>Selisih Settlement per Shift</h2><table><thead><tr><th>Shift / Jenis</th><th>Kasir 1+2</th><th>Settlement</th><th>Selisih</th></tr></thead><tbody>${[0,1,2].map(si=>['etrans','pln'].map(k=>{let x=shiftCompare(state,si,k);return `<tr><td>Shift ${si+1} · ${k==='etrans'?'eTrans':'PLN'}</td><td>${money(x.cash)}</td><td>${settlementLabel(x.settlement)}</td><td>${settlementLabel(x.diff)}</td></tr>`}).join('')).join('')}</tbody></table>`}
async function v4ClickHandler(event){
 const b=event.target.closest('button');if(!b||pinLocked)return;
 if(b.dataset.v4Submit){let [si,ci]=b.dataset.v4Submit.split(',').map(Number);await v4ActWorkflow('submit',si,ci)}
 if(b.dataset.v4Review){let [action,s,c]=b.dataset.v4Review.split(',');await v4ActWorkflow(action,Number(s),Number(c))}
 if(b.dataset.v4Day){dateManual=true;switchDay(b.dataset.v4Day);navigate('v4-monitor')}
 if(b.dataset.v4Store){let s=cloud?.stores?.find(x=>x.store_id===b.dataset.v4Store);if(s){await cloudSelectStore(s);navigate('dashboard')}}
 if(b.dataset.v4Restore)await v4RestoreDay(b.dataset.v4Restore);
 if(!b.dataset.v4Action)return;
 const a=b.dataset.v4Action;
 if(a==='refresh'){await cloudRefreshDocs(true);await v4FetchAll();notify('Data cloud telah diperiksa ulang')}
 if(a==='backup')await v4BackupDay();
 if(a==='whatsapp'){
  let text=v4WhatsAppText();if(navigator.share){try{await navigator.share({title:'Rekap KLEREK',text});return}catch(e){if(e.name==='AbortError')return}}
  let link='https://wa.me/?text='+encodeURIComponent(text);if(navigator.onLine){let opened=window.open(link,'_blank','noopener,noreferrer');if(opened)return}copyText(text,'Teks laporan WA disalin');
 }
 if(a==='diff-csv'){let rows=v4DifferenceRows(),lines=[['Tanggal','Shift','Slot','Nama','Klerek','Kas Aktual','Selisih (Aktual - Klerek)'],...rows.map(r=>[r.date,r.shift,r.slot,r.name,r.net,r.actual,r.diff])];download(csvFromRows(lines),'Selisih_Klerek_'+selectedMonth+'.csv','text/csv;charset=utf-8')}
 if(a==='audit-csv'&&v4IsManager()){let lines=[['Waktu','Akun ID','Dokumen','Aksi','Sebelum','Sesudah'],...V4.audit.map(a=>[a.occurred_at,a.actor,a.item_key,a.action,JSON.stringify(a.before_summary||{}),JSON.stringify(a.after_summary||{})])];download(csvFromRows(lines),'Audit_Klerek_'+today()+'.csv','text/csv;charset=utf-8')}
 if(a==='multi-refresh')await v4LoadMulti();
}
document.addEventListener('click',e=>{v4ClickHandler(e).catch(err=>notify('Fitur v4: '+cloudError(err)))},false);
document.addEventListener('change',async e=>{
 if(!e.target.dataset.v4Slot||!v4IsAdmin()||!V4.ready)return;
 let [si,ci]=e.target.dataset.v4Slot.split(',').map(Number),uid=e.target.value;
 if(!confirm(uid?'Tetapkan kasir ini ke Shift '+(si+1)+' Kasir '+(ci+1)+'?':'Kosongkan penugasan Shift '+(si+1)+' Kasir '+(ci+1)+'?'))return render();
 const func=uid?'klerek_assign_slot':'klerek_unassign_slot',args=uid?{p_store_id:cloud.storeId,p_user_id:uid,p_shift:si+1,p_slot:ci+1}:{p_store_id:cloud.storeId,p_shift:si+1,p_slot:ci+1};
 const {error}=await cloud.client.rpc(func,args);if(error)notify('Gagal mengatur slot: '+cloudError(error));else notify('Penugasan slot berhasil disimpan');await v4FetchAll();render();
},false);
setInterval(()=>{if(cloud?.ready&&navigator.onLine&&!V4.busy)v4FetchAll().catch(()=>{})},90000);
setInterval(()=>{if(cloud?.ready&&navigator.onLine){cloudFlushAll();v4AutoBackup().catch(()=>{})}},30000);
window.addEventListener('online',()=>{setTimeout(()=>{if(cloud?.ready){cloudFlushAll();v4FetchAll().catch(()=>{})}},800)});

// Simpan juga hasil migrasi slot kasir lama sebelum memulai sesi berikutnya.
save();render();initCloud();
})();
</script>

    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .catch(err => console.warn('Mode PWA belum aktif, aplikasi tetap bisa digunakan:', err));
  });
